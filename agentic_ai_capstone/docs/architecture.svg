<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="780" viewBox="0 0 1080 780">
  <style>
    .box { fill: #f8fafc; stroke: #0f172a; stroke-width: 2; rx: 10; ry: 10; }
    .title { font-family: monospace; font-size: 20px; font-weight: bold; fill: #0f172a; }
    .text { font-family: monospace; font-size: 16px; fill: #0f172a; }
    .arrow { stroke: #334155; stroke-width: 2; marker-end: url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155" />
    </marker>
  </defs>

  <text x="20" y="32" class="title">Multi-Agent Customer Support System Architecture</text>

  <rect x="40" y="60" width="1000" height="70" class="box"/>
  <text x="420" y="104" class="text">User Interface (CLI)</text>

  <rect x="40" y="160" width="1000" height="90" class="box"/>
  <text x="410" y="193" class="text">Triage Agent (Supervisor)</text>
  <text x="95" y="220" class="text">Classifies intent, enforces input guardrails, routes to specialist</text>

  <line x1="540" y1="130" x2="540" y2="158" class="arrow"/>
  <line x1="540" y1="250" x2="540" y2="286" class="arrow"/>

  <rect x="40" y="290" width="1000" height="240" class="box"/>
  <text x="470" y="320" class="text">Specialist Agents</text>

  <rect x="90" y="350" width="280" height="150" class="box"/>
  <text x="175" y="378" class="text">Billing Agent</text>
  <text x="110" y="405" class="text">Tools:</text>
  <text x="110" y="430" class="text">- get_invoice</text>
  <text x="110" y="455" class="text">- get_payment_history</text>
  <text x="110" y="480" class="text">- update_payment_method</text>

  <rect x="400" y="350" width="280" height="150" class="box"/>
  <text x="450" y="378" class="text">Technical Agent</text>
  <text x="420" y="405" class="text">Tools:</text>
  <text x="420" y="430" class="text">- run_diagnostics</text>
  <text x="420" y="455" class="text">- check_service_status</text>
  <text x="420" y="480" class="text">- create_ticket</text>

  <rect x="710" y="350" width="280" height="150" class="box"/>
  <text x="790" y="378" class="text">Refund Agent</text>
  <text x="730" y="405" class="text">Tools:</text>
  <text x="730" y="430" class="text">- get_order_details</text>
  <text x="730" y="455" class="text">- calculate_refund</text>
  <text x="730" y="480" class="text">- process_refund (HITL)</text>

  <rect x="40" y="550" width="1000" height="100" class="box"/>
  <text x="430" y="580" class="text">Shared Infrastructure</text>
  <text x="90" y="610" class="text">Memory Store</text>
  <text x="310" y="610" class="text">Knowledge Base</text>
  <text x="540" y="610" class="text">Tool Registry</text>
  <text x="760" y="610" class="text">State + Handoff Context</text>

  <rect x="40" y="670" width="1000" height="80" class="box"/>
  <text x="430" y="698" class="text">Safety and Observability</text>
  <text x="90" y="724" class="text">Injection Defense | PII Masking | Tracing + Cost Tracking | HITL Approval</text>
</svg>
