[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-ai-capstone"
version = "0.1.0"
description = "Multi-agent customer support system with guardrails and observability."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "langgraph>=0.2.56",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
